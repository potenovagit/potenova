name: deploy-api

# Builds the API container image and pushes it to Azure Container Registry.
# Manually triggered (workflow_dispatch). The Free Trial subscription blocks
# server-side ACR Tasks builds, so the image is built here on the GitHub runner
# and pushed — the CI/CD build path ADR-0013 calls for. Deploying the image to
# the running service is a separate, gated step.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ACR_LOGIN_SERVER  e.g. acrpotenovadigitery.azurecr.io
#   ACR_USERNAME      ACR admin username
#   ACR_PASSWORD      ACR admin password

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        default: v1

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/potenova-api:${{ github.event.inputs.tag }}
            ${{ secrets.ACR_LOGIN_SERVER }}/potenova-api:${{ github.sha }}
